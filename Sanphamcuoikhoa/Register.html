<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="icon" href="src/img/coffee-cup.png">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: url(src/image/Background.jpg);
            background-position: center;
            background-repeat: no-repeat;
            background-size: 227vh;
        }




        .auth_container {
            max-width: 500px;
            background-color: rgba(0, 0, 0, 0.75);
            padding: 60px;
            border-radius: 15px;
        }

        .auth_logo img {
            max-width: 300px;
        }


        .remember-me {
            color: rgb(255, 255, 255);
        }

    </style>
</head>
<body>
    <div class="auth_container" >
        <!--  Header  -->
        <div class="auth_logo text-center">
            <img src="src/image/Vietsic.png" alt="Logo">
            <h4 class="text-primary py-4">Đăng Ký</h4>
        </div>
        <!--  Form  -->
        <form action="" id="register-form">
            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="username"  placeholder="Username">
                <label for="floatingInput">Username</label>
              </div>

            <div class="form-floating mb-3">
                <input type="email" class="form-control" id="email"  placeholder="name@example.com">
                <label for="floatingInput">Email address</label>
              </div>

              <div class="form-floating mb-3">
                <input type="password" class="form-control" id="password"  placeholder="Password">
                <label for="floatingPassword">Password</label>
              </div>
              
              <div class="form-floating">
                <input type="password" class="form-control" id="confirmpassword"  placeholder="Confirm Password">
                <label for="floatingPassword">Confirm Password</label>
              </div>

              <div class="mt-3 text-center">
                <button class="btn btn-primary w-100 btn-lg" type="submit"> Đăng Ký</button>
              </div>
        </form>
        <!--  Đăng Ký -->
          
        <div class="text-center mt-3">
            <span class="text-white">Bạn đã có tài khoản?</span>
            <a class="text-decoration-none fw-bold" href="Login.html">Đăng Nhập</a>

        </div>
    </div>



    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <!-- Core Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <!-- Auth -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <!-- Firestore -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <!-- Firebase Config -->
    <script src="src/js/Firebase-config.js"></script>


    <script src="src/js/Register.js"></script>

</body>
</html>
